services:
  - type: web
    name: ecommerce-analytics-server
    env: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://awasthi-fashion-and-cosmetics.vercel.app
      - key: PORT
        value: 10000

  - type: background_worker
    name: ecommerce-ml-service
    env: python
    plan: free
    buildCommand: cd ml-service && pip install -r requirements.txt
    startCommand: cd ml-service && python main.py
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: ecommerce-analytics
      - key: ML_RUN_INTERVAL
        value: 3600
      - key: FLASK_ENV
        value: production
