services:
  - type: web
    name: ecommerce-analytics-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://awasthi-fashion-cosmetics.vercel.app
      - key: PORT
        value: 5000

  - type: background_worker
    name: ecommerce-ml-service
    env: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: ecommerce-analytics
      - key: ML_RUN_INTERVAL
        value: 3600
      - key: FLASK_ENV
        value: production
